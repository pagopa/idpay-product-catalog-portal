# Build and deploy the selected initiative on develop/uat pushes or manual runs.
trigger:
  branches:
    include:
      - develop
      - uat

# Azure DevOps pipeline to release a new version and deploy to production.
variables:
  NODE_VERSION: '22.20.0'
  YARN_CACHE_FOLDER: $(Pipeline.Workspace)/.yarn
  # Execute agents (jobs) on latest Ubuntu version.
  vmImageNameDefault: 'ubuntu-latest'

  basePath: elenco-prodotti

  ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/uat'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix')) }}:
    environment: 'UAT'
    azure_subscription: $(UAT_AZURE_SUBSCRIPTION)
    cdn_endpoint: '$(UAT_CDN_ENDPOINT)'
    cdn_profile: '$(UAT_CDN_PROFILE)'
    resource_group: '$(UAT_RESOURCE_GROUP)'
    storage_account: '$(UAT_STORAGE_ACCOUNT)'

    cdn_domains: '$(UAT_CDN_DOMAINS)'

  ${{ elseif eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
    environment: 'PROD'
    azure_subscription: $(PROD_AZURE_SUBSCRIPTION)
    cdn_endpoint: '$(PROD_CDN_ENDPOINT)'
    cdn_profile: '$(PROD_CDN_PROFILE)'
    resource_group: '$(PROD_RESOURCE_GROUP)'
    storage_account: '$(PROD_STORAGE_ACCOUNT)'

    cdn_domains: '$(PROD_CDN_DOMAINS)'

  ${{ else }}:
    environment: 'DEV'
    azure_subscription: $(DEV_AZURE_SUBSCRIPTION)
    cdn_endpoint: '$(DEV_CDN_ENDPOINT)'
    cdn_profile: '$(DEV_CDN_PROFILE)'
    resource_group: '$(DEV_RESOURCE_GROUP)'
    storage_account: '$(DEV_STORAGE_ACCOUNT)'

    cdn_domains: '$(DEV_CDN_DOMAINS)'

parameters:
  - name: 'INITIATIVE'
    displayName: 'Initiative to deploy'
    type: string
    default: bonusdecoder
    values:
      - bonusdecoder
      - bonusvalore
      - bonuselettrodomestici

pr: none

resources:
  repositories:
    - repository: pagopaCommons
      type: github
      name: pagopa/azure-pipeline-templates
      ref: refs/tags/v18
      endpoint: 'io-azure-devops-github-ro'
    - repository: selfcareCommon
      type: github
      name: pagopa/selfcare-common-frontend
      ref: refs/heads/main
      endpoint: 'io-azure-devops-github-ro'

pool:
  vmImage: '$(vmImageNameDefault)'

stages:
  # Prepare Artifact with application bundle
  - stage: Prepare_artifact
    condition: succeeded()
    jobs:
      - job: 'make_build'
        steps:
          - template: .devops/azure-templates/setup-yarn-cache.yml@selfcareCommon
          - template: templates/node-job-setup/template.yaml@pagopaCommons
            parameters:
              nodeVersion: $(NODE_VERSION)
          - bash: |
              yarn build --mode $(environment)
            displayName: 'Build files'
            env:
              VITE_INITIATIVE: '${{ parameters.INITIATIVE }}'

          - bash: |
              printf '%s\n%s %s\n' "$EXECUTION_ID" "$BUILD_SOURCEBRANCH" "$BUILD_SOURCEVERSION" > "$(System.DefaultWorkingDirectory)/dist/build.info"
            env:
              EXECUTION_ID: '$(Build.BuildNumber) - $(Build.DefinitionName)($(Build.BuildId))'
            displayName: 'Build info'
          - publish: $(System.DefaultWorkingDirectory)/dist
            artifact: Bundle

  # Deploy bundle
  - stage: 'Deploy_to_${{ variables.environment }}'
    condition: succeeded()
    jobs:
      - job: 'Deploy_to_${{ variables.environment }}'
        steps:
          - checkout: none

          - download: current
            artifact: Bundle

          - task: AzureCLI@2
            displayName: 'Sync product catalog storage'
            inputs:
              azureSubscription: '$(azure_subscription)'
              scriptLocation: inlineScript
              scriptType: bash
              inlineScript: |
                az storage blob sync --container '$(blob_container_name)' --account-name $(storage_account) -s "$(Pipeline.Workspace)/Bundle" --destination '${{ parameters.INITIATIVE }}/$(basePath)/'
          - task: AzureCLI@2
            displayName: 'Purge Azure Front Door CDN endpoint'
            inputs:
              azureSubscription: '$(azure_subscription)'
              scriptLocation: inlineScript
              scriptType: bash
              inlineScript: |
                az afd endpoint purge -g $(resource_group) \
                --profile-name $(cdn_profile) \
                --endpoint-name $(cdn_endpoint) \
                --domains $(cdn_domains) \
                --content-paths "/${{ parameters.INITIATIVE }}/$(basePath)" "/${{ parameters.INITIATIVE }}/$(basePath)/*"
